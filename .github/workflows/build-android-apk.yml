name: Build LedgerFlow Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Published HTTPS URL of your LedgerFlow app (leave default to use repo APP_URL variable or default URL)"
        required: false
        default: ""
      create_release:
        description: "Also publish a GitHub Release with direct LedgerFlow.apk download link"
        type: boolean
        required: false
        default: true
  push:
    branches:
      - main
    paths:
      - "android-apk/**"
      - "public/pwa-512x512.png"
      - "public/pwa-192x192.png"
      - ".github/workflows/build-android-apk.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target LedgerFlow URL
        id: resolve_url
        shell: bash
        env:
          INPUT_URL: ${{ github.event.inputs.app_url }}
          VAR_URL: ${{ vars.APP_URL }}
        run: |
          TARGET_URL="${INPUT_URL:-$VAR_URL}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://ais-pre-mon76kn4wttmrf7tqaxi6e-616579702543.asia-northeast1.run.app"
          fi
          echo "url=$TARGET_URL" >> "$GITHUB_OUTPUT"
          echo "Building LedgerFlow Android APK for URL: $TARGET_URL"

      - name: Sync LedgerFlow launcher icons
        shell: bash
        run: |
          mkdir -p android-apk/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-apk/app/src/main/res/mipmap-xhdpi
          if [ -f public/pwa-512x512.png ]; then
            cp public/pwa-512x512.png android-apk/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi
          if [ -f public/pwa-192x192.png ]; then
            cp public/pwa-192x192.png android-apk/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build installable LedgerFlow APK
        shell: bash
        env:
          APP_URL: ${{ steps.resolve_url.outputs.url }}
        run: |
          gradle -p android-apk assembleDebug -PAPP_URL="$APP_URL" --no-daemon

      - name: Package APK output
        shell: bash
        run: |
          mkdir -p dist-apk
          cp android-apk/app/build/outputs/apk/debug/app-debug.apk dist-apk/LedgerFlow-v2.0.0.apk
          ls -lh dist-apk/LedgerFlow-v2.0.0.apk

      - name: Upload LedgerFlow.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerFlow-Android-APK
          path: dist-apk/LedgerFlow-v2.0.0.apk
          retention-days: 90

      - name: Publish GitHub Release with direct APK download
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('apk-v2.0.0-{0}', github.run_number) }}
          name: LedgerFlow Android APK (v2.0.0)
          body: |
            Automated Android APK build for **LedgerFlow v2.0.0** (App Developed by Shakti Chahar).

            - **Target App URL**: `${{ steps.resolve_url.outputs.url }}`
            - **Installation**: Download `LedgerFlow-v2.0.0.apk` below on your Android phone and tap it to install (allow "Install unknown apps" if prompted).
          files: dist-apk/LedgerFlow-v2.0.0.apk
