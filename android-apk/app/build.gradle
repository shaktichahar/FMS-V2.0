plugins {
    id 'com.android.application'
}

def configuredAppUrl = (project.findProperty("APP_URL") ?: System.getenv("APP_URL") ?: "https://ais-pre-mon76kn4wttmrf7tqaxi6e-616579702543.asia-northeast1.run.app").toString().trim()
def escapedAppUrl = configuredAppUrl.replace("\\", "\\\\").replace("\"", "\\\"")

android {
    namespace 'in.ledgerflow.app'
    compileSdk 34

    defaultConfig {
        applicationId 'in.ledgerflow.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0.0'

        buildConfigField 'String', 'APP_URL', "\"${escapedAppUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.13.1'
}
